# Deterministic keyless composition overlay for the dsh-code closed-loop test.
# Applied with `dsh --profile headless --patch <this-file> "<task>"`. Registers
# the mock adapter, repoints the default model to it, and leaves the DeepSeek
# adapter mounted but unselected (so no credential is ever requested).

- insert:
    - id: dsh-code-mock-llm
      name: 'file:///Users/qingwei/dev/AILearn/dsh-code/tests/fixtures/mock-adapter.mjs'

- id: agent-default-model
  config:
    provider: mock
    model: mock
