name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        type: string
      publish:
        description: Publish after both platform smoke jobs pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: npm install --global npm@11.15.0
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          node -e 'if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$VERSION"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib
      - run: pnpm run typecheck
      - run: pnpm test
      - run: node scripts/build-release.mjs --version ${{ steps.release.outputs.version }}
      - run: node scripts/verify-tarball.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.run_id }}
          path: |
            dist/npm/*.tgz
            dist/npm/*.sha256
            dist/npm/candidate.json
            dist/npm/sbom.cdx.json
          if-no-files-found: error

  smoke:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            node: 22.19.0
          - runner: macos-14
            platform: darwin-arm64
            node: 24.x
          - runner: windows-2025
            platform: win32-x64
            node: 22.19.0
          - runner: windows-2025
            platform: win32-x64
            node: 24.x
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ github.run_id }}
          path: dist/npm
      - run: node scripts/smoke-install.mjs --platform ${{ matrix.platform }} --coexist

  publish:
    needs: [candidate, smoke]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ github.run_id }}
          path: dist/npm
      - run: node scripts/publish-candidate.mjs --tag ${{ needs.candidate.outputs.npm-tag }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: gh release create "v${VERSION}" dist/npm/*.tgz dist/npm/*.sha256 dist/npm/sbom.cdx.json --generate-notes --verify-tag
