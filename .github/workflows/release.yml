name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        type: string
      publish:
        description: Publish after both platform smoke jobs pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: npm install --global npm@11.15.0
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          node -e 'if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$VERSION"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib
      - run: pnpm run typecheck
      - run: pnpm test
      - run: node scripts/build-release.mjs --version ${{ steps.release.outputs.version }}
      - run: node scripts/verify-tarball.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.run_id }}
          path: |
            dist/npm/*.tgz
            dist/npm/*.sha256
            dist/npm/candidate.json
            dist/npm/sbom.cdx.json
          if-no-files-found: error

  smoke:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            node: 22.19.0
            coexist: --coexist
          - runner: macos-14
            platform: darwin-arm64
            node: 24.x
            coexist: ''
          - runner: windows-2025
            platform: win32-x64
            node: 22.19.0
            coexist: --coexist
          - runner: windows-2025
            platform: win32-x64
            node: 24.x
            coexist: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-${{ github.run_id }}
          path: dist/npm
      - run: node scripts/smoke-install.mjs --platform ${{ matrix.platform }} ${{ matrix.coexist }}

  publish:
    needs: [candidate, smoke]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-${{ github.run_id }}
          path: dist/npm
      - run: node scripts/publish-candidate.mjs --tag ${{ needs.candidate.outputs.npm-tag }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: gh release create "v${VERSION}" dist/npm/*.tgz dist/npm/*.sha256 dist/npm/sbom.cdx.json --generate-notes --verify-tag
